name: Feature request
description: Propose a change — formats (manifest/ledger/snapshot) need an RFC first
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? If it touches manifest/ledger/snapshot formats, expect an RFC discussion.
