name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Acceptance suite (24 controls)
    runs-on: ubuntu-latest
    env:
      # simnet fixture passphrase — a public test constant, not a real secret
      TAMGA_KS_PASSPHRASE: simnet-2026
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies (PyNaCl + jsonschema)
        run: pip install -r requirements.txt

      - name: wasmtime v48.0.1 (RFC-002 digest-pinned release, via tests/setup.sh)
        run: bash tests/setup.sh

      - name: Acceptance suite (run_all)
        run: bash tests/run_all.sh

      - name: Negative vectors — node-cosign (AT-003)
        run: bash tests/negative_cosign.sh

      - name: Negative vectors — snapshot attacks (AT-001f)
        run: bash tests/negative_snapshots.sh

      - name: Manifest schema cross-validation
        run: python3 tests/cross_validate_schema.py

      - name: Economy simulations (unit-economics invariants)
        run: |
          python3 tests/sim/tokenomics_sim.py
          python3 tests/sim/economy_sim.py

      - name: Adversarial audits — embedded chain + node-cosign (simnet, no wasmtime)
        run: |
          python3 tests/audit7_embedded_chain.py
          python3 tests/audit8_node_cosign.py

      # CI runners are shared — a quiet-host guarantee is impossible here. The
      # signed overhead claim (E-4) is backed by local quiet-host evidence only;
      # on CI the bench runs in smoke mode to prove the tool end-to-end.
      - name: Runner overhead benchmark (CI smoke — claim evidence is local quiet-host)
        run: python3 tests/bench_runner_overhead.py --allow-busy

      - name: Documentation link integrity
        run: python3 tools/check_links.py
