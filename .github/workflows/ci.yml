name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Acceptance suite (18 controls)
    runs-on: ubuntu-latest
    env:
      # simnet fixture passphrase — a public test constant, not a real secret
      TAMGA_KS_PASSPHRASE: simnet-2026
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (3.12)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies (PyNaCl + jsonschema)
        run: pip install -r requirements.txt

      - name: wasmtime v48.0.1 (RFC-002 digest-pinned release)
        run: |
          mkdir -p tools/bin
          curl -sSL -o /tmp/wt.tar.xz \
            https://github.com/bytecodealliance/wasmtime/releases/download/v48.0.1/wasmtime-v48.0.1-x86_64-linux.tar.xz
          tar -xJf /tmp/wt.tar.xz -C /tmp
          cp /tmp/wasmtime-v48.0.1-x86_64-linux/wasmtime tools/bin/wasmtime
          tools/bin/wasmtime --version

      - name: Acceptance suite (run_all)
        run: bash tests/run_all.sh

      - name: Negative vectors — node-cosign (AT-003)
        run: bash tests/negative_cosign.sh

      - name: Negative vectors — snapshot attacks (AT-001f)
        run: bash tests/negative_snapshots.sh

      - name: Manifest schema cross-validation
        run: python3 tests/cross_validate_schema.py

      - name: Economy simulations (unit-economics invariants)
        run: |
          python3 tests/sim/tokenomics_sim.py
          python3 tests/sim/economy_sim.py
