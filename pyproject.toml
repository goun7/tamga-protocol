[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tamga-protocol"
version = "0.2.3"
description = "Self-custodial hash-chained work-receipt ledger for autonomous AI agents (RFC-002/003/007)"
readme = "docs/QUICKSTART.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Tamga Protocol" }]
keywords = ["ai-agents", "receipts", "hash-chain", "tamper-evident", "wasm", "wasi", "x402", "cryptography", "agent-memory"]
urls = { Homepage = "https://github.com/goun7/tamga-protocol", Documentation = "https://github.com/goun7/tamga-protocol/tree/main/docs", Changelog = "https://github.com/goun7/tamga-protocol/blob/main/CHANGELOG.md", "Bug Tracker" = "https://github.com/goun7/tamga-protocol/issues" }
dependencies = ["PyNaCl>=1.5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
tamga = "tamga_bootstrap:main"

[tool.setuptools]
packages = ["templates"]
py-modules = ["tamga_runner", "tamga_validator", "tamga_netproxy", "tamga_net_shim", "tamga_bootstrap", "tamga_verify_mini", "tamga_bundle", "tamga_explain", "tamga_keccak", "tamga_project_head", "tamga_pugio_receiver"]
include-package-data = false

[tool.setuptools.package-data]
templates = ["agent.wasm", "tamga.json"]
